.tgl input:checked{background:var(--accent)}
.tgl input:checked::after{transform:translateX(20px)}
.mint .link{color:var(--mint-accent)}
.tgl input:disabled{opacity:.4;cursor:not-allowed}
.themerow{padding:14px 0 6px}
.themerow b{display:block}
.themerow small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.themerow .seg{margin-top:10px;background:var(--surface2)}
.lock{position:fixed;inset:0;z-index:60;background:var(--lock-bg);color:var(--lock-fg);display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:calc(36px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lclose{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));background:rgba(255,255,255,.08);border-color:transparent;color:var(--lock-fg)}
.lmark{margin-top:min(7vh,56px)}
.lmsg{margin-top:min(11vh,96px);text-align:center;font-weight:700;font-size:17px;line-height:1.6;min-height:3.2em}
.ldots{display:flex;gap:20px;margin-top:20px}
.ldots span{width:17px;height:17px;border-radius:50%;background:var(--lock-dim);transition:background .12s}
.ldots span.on{background:var(--lock-fg)}
.ldots.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.lerr{min-height:1.6em;margin-top:14px;font-size:13.5px;font-weight:700;color:#ff8f87;text-align:center}
.kpad{display:grid;grid-template-columns:repeat(3,1fr);width:min(100%,330px);margin-top:auto;padding-top:16px}
.k{height:min(11vh,86px);display:grid;place-items:center;font-family:var(--font-num);font-size:38px;font-weight:700;color:var(--lock-fg);border-radius:50%}
.k:active{background:rgba(255,255,255,.1)}
.k svg{width:40px;height:34px}
.lforgot{margin-top:10px;color:var(--lock-fg);opacity:.75;font-size:13.5px;font-weight:700;padding:8px 12px;text-decoration:underline;text-underline-offset:3px}
.lpanel{width:min(100%,360px);margin-top:min(5vh,36px)}
.lpanel h3{font-size:18px;font-weight:900;text-align:center}
.lpanel p{font-size:13.5px;line-height:1.7;margin-top:12px;opacity:.85}
.lpanel input{width:100%;margin-top:14px;padding:14px;border-radius:14px;border:1.5px solid var(--lock-dim);background:transparent;color:var(--lock-fg);font-family:var(--font-num);font-size:20px;letter-spacing:.12em;text-align:center;text-transform:uppercase}
.lpanel .btn{margin-top:12px;border-color:var(--lock-fg);color:var(--lock-fg)}
.lpanel .btn.primary{background:var(--lock-fg);color:var(--lock-bg)}
.lpanel .btn.danger{border-color:#ff8f87;color:#ff8f87}
.lpanel hr{border:0;border-top:1px solid var(--lock-dim);margin:22px 0 4px}
.rcode{font-family:var(--font-num);font-size:26px;font-weight:700;letter-spacing:.1em;text-align:center;margin-top:18px;padding:18px 8px;border-radius:16px;background:rgba(255,255,255,.08);user-select:all;-webkit-user-select:all}
body.priv .app,body.priv .tabbar,body.priv .selbar,body.priv .sheet{filter:blur(24px)}
.seg.s4{grid-template-columns:repeat(4,1fr)}
.bsub{font-size:12.5px;color:var(--muted);line-height:1.5}
@media (prefers-reduced-motion: reduce){.ldots.shake{animation:none}}
.dcard .dt{display:block;font-size:17px}
.hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.dnote{display:grid;gap:6px;margin-top:14px}
.dnote input{border:0;background:none;padding:0;font-size:16px}
.pastt{margin-top:28px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.sheet,.sheet.open,.toast,.sw input::after{transition:none}}

.pdfnav{display:flex;justify-content:space-between;align-items:center;margin:6px 0 16px}
.pdfnav b{font-size:18px}
.flip svg{transform:scaleX(-1)}
.pdfpages{display:grid;gap:14px}
.pdfpg{width:100%;height:auto;display:block;background:#fff;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.btn:disabled,.rbtn:disabled{opacity:.4;cursor:default}
/* ===== Tablet & desktop ===== */
@media (min-width:600px){
  .app{max-width:640px}
  .tabbar{max-width:608px}
}
@media (min-width:960px){
  body{padding-left:0;padding-right:0}
  .app{max-width:none;margin:0;padding:0 clamp(24px,4vw,64px) 56px calc(236px + clamp(24px,4vw,64px))}
  .top,#view{max-width:1040px;margin-left:auto;margin-right:auto}
  .top{padding:22px 0 14px}
  .greet{font-size:30px;margin:10px 0 20px}
  .pg-title{font-size:32px;margin:10px 0 22px}

  .tabbar{left:0;top:0;bottom:0;right:auto;width:236px;max-width:none;margin:0;border-radius:0;border:0;border-right:1px solid var(--line);box-shadow:none;background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;grid-template-columns:1fr;align-content:start;gap:6px;padding:30px 14px}
  .tabbar::before{content:"ふたば家計簿";display:block;font-size:20px;font-weight:900;padding:4px 18px 26px}
  .tab{flex-direction:row;justify-content:flex-start;gap:14px;padding:14px 18px;font-size:15px;border-radius:14px}
  .tab[aria-current="page"]{background:var(--surface)}
  .selbar{left:calc(236px + clamp(24px,4vw,64px));right:clamp(24px,4vw,64px);max-width:560px;bottom:24px}

  .stack{display:block;column-count:2;column-gap:20px}
  .stack>*{break-inside:avoid;-webkit-column-break-inside:avoid;margin-bottom:20px}
  .v-list{max-width:760px}
  .v-trade{column-count:2;column-gap:24px}
  .v-trade .pg-title{column-span:all}
  .v-trade .grp{break-inside:avoid}
  .plot{height:170px}
  .bar{width:46px}
  .mid{font-size:38px}

  .sheet{background:rgba(0,0,0,.55);display:grid;place-items:center;transform:none;opacity:0;overflow:hidden;transition:opacity .2s ease,visibility 0s .2s}
  .sheet.open{opacity:1;transition:opacity .2s ease}
  .sheet-in{width:min(580px,92vw);max-width:none;max-height:min(88vh,860px);overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:26px;padding:0 30px 34px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .sheet-head{padding-top:22px;border-radius:26px 26px 0 0}
  .toast{bottom:32px}
  .lock{z-index:100}
}
@media (min-width:960px) and (hover:hover){
  .tab:hover{background:var(--surface)}
  .rbtn:hover,.pill button:hover{background:var(--surface2)}
  .row:hover .t,.mrow:hover span,.prow:hover>span:first-child{color:var(--accent)}
  .chip:hover,.fc:hover{filter:brightness(1.15)}
  .btn:hover{filter:brightness(1.1)}
}

/* ---------- charts & budget alerts ---------- */
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:baseline}
.donut{width:176px;margin:14px auto 6px}.donut svg{display:block;width:100%;height:auto}
.tsvg{display:block;width:100%;height:auto;margin-top:6px}
.tlegend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:10px}
.tlegend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tavg{font-size:13px;color:var(--muted);margin-top:8px}
.thead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:26px}
.thead .chip{padding:7px 12px;font-size:13px}
.banner .nt:first-of-type{border-top:0}
/* ---------- year report ---------- */
.ymrow{display:grid;grid-template-columns:42px 1fr 1fr 1fr;gap:6px;padding:10px 0;border-top:1px solid var(--line);font-size:12.5px;align-items:baseline}
.ymrow>span{text-align:right}.ymrow.hd{border-top:0;color:var(--muted);font-weight:700;font-size:12px}
.ysum{margin-top:10px;display:grid;gap:4px}
.ysum p{font-size:13.5px;margin:0}
.ychips{margin-top:12px}
.ychips .chip{padding:7px 12px;font-size:13px;display:inline-flex;align-items:center}
.ychips .cdot{margin-right:6px}
.ycsum{margin-top:8px}
/* ---------- loading screen ---------- */
.splash{position:fixed;inset:0;z-index:200;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);transition:opacity .35s ease,visibility 0s .35s}
.splash.out{opacity:0;visibility:hidden;pointer-events:none}
.splash-mark{position:relative;width:104px;height:104px;border-radius:30px;background:#fff var(--sprout) center 54%/58% no-repeat;box-shadow:0 16px 40px rgba(0,212,53,.28);opacity:0;transform:scale(.6);animation:sp-pop .7s cubic-bezier(.3,1.4,.5,1) forwards}
.splash-mark svg{position:absolute;left:50%;top:12px;width:44px;height:36px;margin-left:-22px;overflow:visible}
.splash-leaf{fill:#bff0d3;transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);animation:sp-grow .55s .5s cubic-bezier(.3,1.5,.5,1) forwards}
.splash-leaf.r{animation-delay:.62s}
@keyframes sp-pop{to{opacity:1;transform:none}}
@keyframes sp-grow{to{transform:scale(1)}}
.splash-name{font-size:22px;font-weight:900;letter-spacing:.06em;opacity:0;animation:sp-fade .5s .45s ease forwards}
.splash-bar{width:120px;height:4px;border-radius:99px;background:var(--surface2);overflow:hidden;opacity:0;animation:sp-fade .4s .7s ease forwards}
.splash-bar i{display:block;height:100%;width:40%;border-radius:inherit;background:var(--accent);animation:sp-slide 1.1s ease-in-out infinite}
.splash-msg{font-size:12.5px;color:var(--muted);margin-top:-10px;opacity:0;animation:sp-fade .4s .7s ease forwards}
@keyframes sp-ring{to{stroke-dashoffset:0}}
@keyframes sp-leaf{from{opacity:0;transform:scale(.4) rotate(-20deg)}to{opacity:1;transform:none}}
@keyframes sp-fade{to{opacity:1}}
@keyframes sp-slide{0%{transform:translateX(-110%)}100%{transform:translateX(300%)}}
@media (prefers-reduced-motion:reduce){
  .splash{transition:none}
  .splash-mark{animation:none;opacity:1;transform:none}
  .splash-leaf{animation:none;transform:none}
  .splash-name,.splash-bar,.splash-msg{animation:none;opacity:1}
  .splash-bar i{animation:none;width:100%;opacity:.5}
}

:root{--bg:#0b1210; --surface:#121b17; --surface2:#1b2722; --line:#22302a;
  --hero:#1f8f59; --hero-fg:#ffffff; --hero-muted:rgba(255,255,255,.74);
  --fg:#eef6f1; --muted:#8aa196;
  --accent:#3ecf8e; --accent-soft:#143427; --on-accent:#04140d;
  --mint:#173528; --mint-fg:#e4f5ec; --mint-muted:#8fb3a1; --mint-track:rgba(255,255,255,.13); --mint-accent:#4fdc9f;
  --warn:#f0645a; --amber:#e3ac2e; --chip:#18241f; --nav:rgba(18,27,23,.9);}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f3f8f4; --surface:#ffffff; --surface2:#e7f0ea; --line:#dbe7df;
    --hero:#1f8f59; --hero-fg:#ffffff; --hero-muted:rgba(255,255,255,.76);
    --fg:#0f1f17; --muted:#58695f;
    --accent:#1f8f59; --accent-soft:#d9f0e2; --on-accent:#ffffff;
    --mint:#e1f3e8; --mint-fg:#10281c; --mint-muted:#4d6b5a; --mint-track:rgba(16,40,28,.12); --mint-accent:#1a7a4c;
    --warn:#d64538; --amber:#ac770b; --chip:#e5efe8; --nav:rgba(255,255,255,.92);}}
:root[data-theme="light"]{--bg:#f3f8f4; --surface:#ffffff; --surface2:#e7f0ea; --line:#dbe7df;
  --hero:#1f8f59; --hero-fg:#ffffff; --hero-muted:rgba(255,255,255,.76);
  --fg:#0f1f17; --muted:#58695f;
  --accent:#1f8f59; --accent-soft:#d9f0e2; --on-accent:#ffffff;
  --mint:#e1f3e8; --mint-fg:#10281c; --mint-muted:#4d6b5a; --mint-track:rgba(16,40,28,.12); --mint-accent:#1a7a4c;
  --warn:#d64538; --amber:#ac770b; --chip:#e5efe8; --nav:rgba(255,255,255,.92);}
body{letter-spacing:.01em}
.greet{font-size:28px;font-weight:800;letter-spacing:-.01em}
.pg-title{font-size:30px;font-weight:800;letter-spacing:-.01em}
.card{border-radius:26px;border:1px solid var(--line)}
.card.flush{border-color:transparent}
.hero-top{background:var(--hero);color:var(--hero-fg)}
.big{font-weight:800;letter-spacing:-.03em}
.h3{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800}
.h3::before{content:"";flex:none;width:9px;height:9px;border-radius:2px 9px 2px 9px;background:var(--accent)}
.rbtn{border-radius:16px;border-color:transparent;background:var(--surface)}
.pill{border-radius:18px;border-color:transparent}
.pill button{border-radius:16px}
.btn{border-radius:18px;font-weight:800}
.fc,.chip{border-radius:14px}
.seg{border-radius:16px}.seg button{border-radius:13px}
.track,.fill{border-radius:99px}
.sheet-in{border-radius:32px}
.toast{border-radius:18px}

<script>
(function(){
'use strict';
var PKEY='futaba-profiles';
var AVATARS=['🐱','🐶','🐰','🐻','🐼','🦊','🐸','🐧','🐥','🦉','🐢','🐳','🌱','🌸','🌻','🍀','🍎','🍊','🍙','☕','⭐','🌙','🔥','🎵'];
function profLoad(){
  var o=null;try{o=JSON.parse(localStorage.getItem(PKEY)||'null');}catch(e){}
  var l=(o&&Array.isArray(o.list)?o.list:[]).filter(function(p){return p&&/^[a-z0-9]{1,12}$/.test(String(p.id||''))&&String(p.name||'').trim();}).slice(0,6).map(function(p){return {id:String(p.id),name:String(p.name).trim().slice(0,12),ic:AVATARS.indexOf(p.ic)>=0?p.ic:'',uid:/^[a-z0-9_]{3,20}$/.test(String(p.uid||''))?String(p.uid):''};});
  if(!l.some(function(p){return p.id==='main';}))l.unshift({id:'main',name:'メイン'});
  return {cur:(o&&l.some(function(p){return p.id===o.cur;}))?o.cur:'main',list:l};
}
function profSave(P){try{localStorage.setItem(PKEY,JSON.stringify(P));}catch(e){}}
function profAv(id){var c=PROF.list.filter(function(p){return p.id===(id||PROF.cur);})[0];return c&&c.ic?c.ic:'';}
function userBtn(){var b=$('#b-user'),a=profAv();if(b)b.innerHTML=a?'<span class="av">'+a+'</span>':icon('user');}
var PROF=profLoad(),PSFX=PROF.cur==='main'?'':'-'+PROF.cur;
var LS='midori-kakeibo-v1'+PSFX;
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var yen=function(n){return Math.round(n).toLocaleString('ja-JP')};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};

var AB_CFG='futaba-autobk-cfg'+PSFX,AB_DATA='futaba-autobk-data'+PSFX,abLast=0;
function abCfg(){var o=null;try{o=JSON.parse(localStorage.getItem(AB_CFG)||'null');}catch(e){}return {on:!(o&&o.on===false),every:(o&&o.every===7)?7:1,last:(o&&Number(o.last))||0};}
function abCfgSave(c){try{localStorage.setItem(AB_CFG,JSON.stringify(c));}catch(e){}}
function abList(){var a=null;try{a=JSON.parse(localStorage.getItem(AB_DATA)||'null');}catch(e){}return Array.isArray(a)?a.filter(function(x){return x&&typeof x.d==='string'&&x.t;}):[];}
function abPush(label){
  var o=Object.assign({},S);o._cats={out:OUTC,inn:INC};
  var d=JSON.stringify(o);
  if(d.length>800000)return false;
  var l=abList();l.unshift({t:Date.now(),n:S.entries.length,l:label||'',d:d});
  l=l.slice(0,5);
  while(l.length>1&&JSON.stringify(l).length>2000000)l.pop();
  try{localStorage.setItem(AB_DATA,JSON.stringify(l));}
  catch(e){try{localStorage.setItem(AB_DATA,JSON.stringify(l.slice(0,1)));}catch(e2){return false;}}
  return true;
}
function abRun(force){
  var c=abCfg(),now=Date.now();
  if(!force&&(!c.on||!S.entries.length||now-c.last<c.every*86400000))return false;
  if(abPush(force?'手動':'自動')){c.last=now;abCfgSave(c);return true;}
  return false;
}
function abTick(skip){var n=Date.now();if(!skip&&n-abLast<60000)return;abLast=n;abRun(false);}
function abFmt(t){var d=new Date(t);return d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function abSection(){
  var c=abCfg(),l=abList(),cur=c.on?String(c.every):'0';

    '<div class="fld"><span class="lb">自動で作る間隔</span><div class="chips">'+[['1','毎日'],['7','毎週'],['0','オフ']].map(function(p){return '<button class="chip" data-act="ab-set" data-v="'+p[0]+'" aria-pressed="'+(cur===p[0])+'">'+p[1]+'</button>';}).join('')+'</div></div>';

  else h+='<p class="mut" style="font-size:13px;margin-top:10px">まだバックアップはありません。</p>';

function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
var curYM=todayStr().slice(0,7);
function shiftYM(ym,k){var p=ym.split('-').map(Number),y=p[0],m=p[1]+k;while(m<1){m+=12;y--;}while(m>12){m-=12;y++;}return y+'-'+pad(m);}
function ymLabel(ym){return ym.slice(0,4)+'年'+Number(ym.slice(5))+'月';}
function mLabel(ym){return Number(ym.slice(5))+'月';}
function dotDate(d){return d.replace(/-/g,'.');}
function stamp(){var d=new Date();return d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function sumBy(type,ym){return S.entries.reduce(function(a,e){return (e.type===type&&(!ym||e.date.indexOf(ym)===0))?a+e.amount:a;},0);}
function balance(){return totalOpening()+sumBy('in')-sumBy('out')-sumBy('save');}
function saved(){return sumBy('save');}
function money(n){return S.hide?'••••':yen(n);}
function sorted(){return S.entries.slice().sort(function(a,b){return a.date===b.date?(b.id>a.id?1:-1):(a.date<b.date?1:-1);});}
function daysIn(ym){var p=ym.split('-').map(Number);return new Date(p[0],p[1],0).getDate();}
function recDate(r,ym){return ym+'-'+pad(Math.min(r.day,daysIn(ym)));}
function recName(r){return r.memo||catName(r);}
/* adds entries for every recurring rule whose date has come; returns how many were added */
function applyRecurring(){
  if(VIEW)return 0;
  var today=todayStr(),n=0;
  (S.recurring||[]).forEach(function(r){
    var guard=0;
    while(guard++<60&&recDate(r,r.next)<=today){
      S.entries.push({id:uid()+n,date:recDate(r,r.next),type:r.type,amount:r.amount,cat:r.cat,memo:r.memo,note:'',goalId:'',rid:r.id,acc:validAcc(r.acc),to:''});
      r.next=shiftYM(r.next,recEvery(r));n++;
    }
  });
  return n;
}
function csvCell(v,txt){v=String(v==null?'':v);if(txt&&/^[=+\-@\t\r]/.test(v))v="'"+v;return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function xEntries(){
  var r=UI.xr,y=yearOf();
  return sorted().reverse().filter(function(e){return r==='month'?e.date.indexOf(curYM)===0:r==='year'?fyOf(e.date.slice(0,7))===y:true;});
}
function csvText(){
  var T={out:'出金',in:'入金',save:'積立',xfer:'振替'};
  var head=['日付','種別','カテゴリ','内容','金額','メモ','口座','振替先','積立先','定期','タグ','満足度'].map(function(v){return csvCell(v,false);});
  var rows=xEntries().map(function(e){
    var g=e.type==='save'?goalById(e.goalId):null;
    return [e.date,T[e.type],catName(e),e.memo,e.amount,e.note||'',accName(eacc(e)),e.type==='xfer'?accName(e.to):'',g?g.name:'',e.rid?'○':'',tagsOf(e).join(' '),e.type==='out'?satName(e):''].map(function(v,i){return csvCell(v,i===3||i===5||i===6||i===7||i===8||i===10);}).join(',');
  });
  return '\ufeff'+[head.join(',')].concat(rows).join('\r\n')+'\r\n';
}

function fyStart(){var s=Number(S.fyStart);return(s>=1&&s<=12)?s:1;}
function fyOf(ym){var y=Number(ym.slice(0,4)),m=Number(ym.slice(5,7));return String(m>=fyStart()?y:y-1);}
function fyMonths(fy){var s=fyStart(),r=[],k,m,y;for(k=0;k<12;k++){m=s+k;y=Number(fy)+(m>12?1:0);m=(m-1)%12+1;r.push(y+'-'+pad(m));}return r;}
function fyLabel(fy){return fy+(fyStart()===1?'年':'年度');}
function mn(m){return Number(m.slice(5,7))+'月';}
function sumMs(type,ms){return ms.reduce(function(a,m){return a+sumBy(type,m);},0);}
function spentMs(ms){var set={},m={};ms.forEach(function(k){set[k]=1;});S.entries.forEach(function(e){if(e.type==='out'&&set[e.date.slice(0,7)])m[e.cat]=(m[e.cat]||0)+e.amount;});return m;}
function fyNote(){var s=fyStart();return(s===1?'1月から12月':s+'月から翌年'+(s-1)+'月')+'までの合計で管理します。旅行や家電など、月によってばらつく出費向けです。';}
function crLabel(){return fyStart()===1?'1月に繰り越しをリセット':fyStart()+'月(年度の始まり)に繰り越しをリセット';}
function ymNext(m){var y=Number(m.slice(0,4)),mo=Number(m.slice(5,7))+1;if(mo>12){y++;mo=1;}return y+'-'+('0'+mo).slice(-2);}
function normYB(o){var r={};if(o&&typeof o==='object')OUTC.forEach(function(c){var v=Math.round(Number(o[c[0]]));if(v>0)r[c[0]]=v;});return r;}
function carryOn(){return !!S.carry&&S.carry!=='off'&&/^\d{4}-\d{2}$/.test(S.carryFrom||'');}
function carryOf(ym){
  var ci={};
  OUTC.forEach(function(c){ci[c[0]]=0;});
  if(!carryOn()||S.carryFrom>=ym)return ci;
  var sp={};
  S.entries.forEach(function(e){
    if(e.type!=='out')return;
    var k=e.date.slice(0,7);
    if(k<S.carryFrom||k>=ym)return;
    (sp[k]=sp[k]||{});sp[k][e.cat]=(sp[k][e.cat]||0)+e.amount;
  });
  var m=S.carryFrom,guard=0;
  while(m<ym&&guard++<600){
    var nx=ymNext(m);
    OUTC.forEach(function(c){
      var k=c[0],base=Number(S.budgets[k])||0;
      if(!base){ci[k]=0;return;}
      var left=base+ci[k]-((sp[m]||{})[k]||0);
      ci[k]=S.carry==='plus'?Math.max(0,left):left;
    });
    if(S.carryReset&&Number(nx.slice(5,7))===fyStart())OUTC.forEach(function(c){ci[c[0]]=0;});
    m=nx;
  }
  return ci;
}
function budgetRows(){
  var spent=spentByCat(curYM),cm=carryOf(curYM),h='';
  OUTC.forEach(function(c){
    var b=Number(S.budgets[c[0]])||0; if(!b) return;
    var cr=cm[c[0]]||0,eff=Math.max(0,b+cr),u=spent[c[0]]||0,p=eff?u/eff*100:(u>0?101:0);
    h+='<div class="brow '+(p>100?'over':p>=80?'near':'')+'"><div class="between"><b>'+c[1]+'</b><span class="num">'+yen(u)+' / '+yen(eff)+'円</span></div><div class="track"><span class="fill" style="width:'+Math.min(100,p)+'%"></span></div>'+(carryOn()&&cr?'<p class="bsub">繰り越し '+(cr>0?'+':'-')+yen(Math.abs(cr))+'円(基本 '+yen(b)+'円)</p>':'')+'</div>';
  });
  return h;
}
function yearOf(){return fyOf(curYM);}
function spentYear(y){var m={};S.entries.forEach(function(e){if(e.type==='out'&&fyOf(e.date.slice(0,7))===y)m[e.cat]=(m[e.cat]||0)+e.amount;});return m;}
function ybudgetInfo(){

function ycatPct(cat){var b=Number(S.ybudgets[cat])||0;return b?(spentYear(yearOf())[cat]||0)/b*100:-1;}

function satStat(ym){
  var r={good:{n:0,v:0},ok:{n:0,v:0},bad:{n:0,v:0},none:{n:0,v:0},cat:{}};
  S.entries.forEach(function(e){
    if(e.type!=='out'||e.date.indexOf(ym)!==0)return;
    var k=(e.sat==='good'||e.sat==='ok'||e.sat==='bad')?e.sat:'none';
    r[k].n++;r[k].v+=e.amount;
    if(k==='bad')r.cat[e.cat]=(r.cat[e.cat]||0)+e.amount;
  });
  r.rn=r.good.n+r.ok.n+r.bad.n;r.rv=r.good.v+r.ok.v+r.bad.v;
  return r;
}
function satHTML(ym){
  var st=satStat(ym);if(!(st.rn+st.none.n))return '';
  var h='<h3 class="h3" style="margin-top:24px">満足度の振り返り</h3>';
  if(!st.rn)return h+'<p class="note2">出金に満足度(満足・ふつう・後悔)を付けると、ここで振り返れます。'+(VIEW?'':'記録の画面や、明細の詳細から付けられます。')+'</p>';

  parts.forEach(function(p){var o=st[p[0]];h+='<div class="between" style="margin-top:10px"><b><i class="cdot" style="background:'+p[2]+'"></i>'+p[1]+'</b><span class="num">'+money(o.v)+'円 ・ '+o.n+'件 ・ '+Math.round(o.v/st.rv*100)+'%</span></div>';});

  if(cs.length)h+='<p class="note2 num">後悔が多かったカテゴリ: '+cs.map(function(c){return esc(catLbl(c,'out')||'その他')+' '+money(st.cat[c])+'円';}).join(' ・ ')+'</p>';

  return h;
}
/* ---------- 固定費の見直しチェック ---------- */
function normFix(o){
  var r={};
  if(o&&typeof o==='object'&&!Array.isArray(o))Object.keys(o).slice(0,200).forEach(function(k){var v=o[k];if(v==='todo'||v==='done')r[String(k).slice(0,60)]=v;});
  return r;
}
function fixSt(k){var v=S.fixchk&&Object.prototype.hasOwnProperty.call(S.fixchk,k)?S.fixchk[k]:'';return (v==='todo'||v==='done')?v:'';}
function fixKey(cat,name){return (cat+':'+fold(name)).slice(0,60);}
function fixedItems(){
  var months=[curYM,shiftYM(curYM,-1),shiftYM(curYM,-2)],map={},order=[];
  function get(cat,name){
    var k=fixKey(cat,name);
    if(!Object.prototype.hasOwnProperty.call(map,k)){map[k]={key:k,cat:cat,name:name,m:[0,0,0],rec:0};order.push(k);}
    return map[k];
  }
  S.entries.forEach(function(e){

function adviceList(){
  var a=[],day=new Date().getDate(),dim=daysIn(curYM),prev=shiftYM(curYM,-1);
  var out=sumBy('out',curYM),inc=sumBy('in',curYM),sv=sumBy('save',curYM);
  var monthEntries=S.entries.filter(function(e){return e.date.indexOf(curYM)===0;}).length;
  if(!monthEntries){a.push({p:5,l:'tip',t:'今月の記録を始めましょう',b:'右上の＋から入出金を記録すると、ここにアドバイスが表示されます。'});return a;}
  var info=[];try{info=budgetInfo();}catch(e){}
  // 予算超過・ペース超過
  info.forEach(function(i){
    if(i.p>100)a.push({p:1,l:'warn',t:esc(i.n)+'が予算を'+yen(i.u-i.b)+'円超えています',b:'今月はこれ以上増やさないよう、'+esc(i.n)+'の出費を控えめにしましょう。'});
    else if(day>=5&&i.u>0&&i.proj>i.b&&i.left>0){
      var per=Math.max(0,Math.floor((i.b-i.u)/i.left));
      a.push({p:2,l:'near',t:esc(i.n)+'は今のペースだと予算オーバーです',b:'月末の見込みは約'+yen(i.proj)+'円(予算 '+yen(i.b)+'円)。残りは1日あたり'+yen(per)+'円までに抑えると収まります。'});
    }
  });
  // 先月からの増加
  if(day>=7){
    var pv=spentByCat(prev),cu=spentByCat(curYM),best=null;
    OUTC.forEach(function(c){
      var last=pv[c[0]]||0,proj=(cu[c[0]]||0)/day*dim,diff=proj-last;
      if(last>0&&proj>last*1.3&&diff>=5000&&(!best||diff>best.diff))best={n:c[1],diff:diff,last:last,proj:proj};
    });
    if(best)a.push({p:3,l:'near',t:esc(best.n)+'が先月より増えそうです',b:'月末までに約'+yen(best.proj)+'円の見込みで、先月('+yen(best.last)+'円)より約'+yen(best.diff)+'円多くなります。'});
  }
  // 収支
  if(out>inc&&inc>0)a.push({p:1,l:'warn',t:'今月は支出が収入を上回っています',b:'出金 '+yen(out)+'円に対し、入金は '+yen(inc)+'円です。固定費や大きな出費を見直す余地がないか確認しましょう。'});
  else if(inc>0&&day>=10){
    var rate=Math.round((inc-out)/inc*100);
    if(rate>=20)a.push({p:6,l:'ok',t:'収入の'+rate+'%を残せています',b:'この調子です。余裕があれば、積立の目標に回すと貯まりやすくなります。'});
  }
  // 残高
  try{var bal=balance();if(bal<S.low)a.push({p:1,l:'warn',t:'残高が設定金額を下回っています',b:'現在 '+yen(bal)+'円です。次の入金までの出費に気をつけましょう。'});}catch(e){}
  // 予算未設定
  if(!info.length&&out>0)a.push({p:4,l:'tip',t:'カテゴリの予算を決めてみましょう',b:'予算があると、使いすぎの早めの気づきと、月末のペース予測ができます。'});
  // 最大カテゴリ
  var cs=spentByCat(curYM),top=null;
  OUTC.forEach(function(c){var v=cs[c[0]]||0;if(v>0&&(!top||v>top.v))top={n:c[1],v:v};});
  if(top&&out>0){
    var share=Math.round(top.v/out*100);
    if(share>=40&&out>=10000&&top.n!=='住居')a.push({p:5,l:'tip',t:'支出の'+share+'%が'+esc(top.n)+'です',b:'今月いちばん多いカテゴリです('+yen(top.v)+'円)。ここを少し見直すのが近道です。'});
  }
  // サブスク
  try{
    var sl=subList(),st=Math.round(sl.reduce(function(x,r){return x+recMo(r);},0));
    if(sl.length>=3&&st>=3000)a.push({p:5,l:'tip',t:'サブスクが月'+yen(st)+'円(年間'+yen(st*12)+'円)です',b:sl.length+'件を登録中。使っていないものがないか見直してみましょう。'});
  }catch(e){}
  try{S.goals.forEach(function(g){var p=goalPlan(g);if(p&&p.state==='late')a.push({p:2,l:'near',t:esc(g.name)+'は、あと月'+yen(Math.max(0,p.need-Math.round(p.avg)))+'円ほど増やすと期限に間に合います',b:'期限 '+ymLabel(g.due)+'まで月'+yen(p.need)+'円ずつ必要です。積立を先に取り分けておくと続けやすくなります。'});});}catch(e){}
  return a;
}

function goalSavedIn(id,ym){return S.entries.reduce(function(a,e){return (e.type==='save'&&e.goalId===id&&e.date.indexOf(ym)===0)?a+e.amount:a;},0);}
function goalForecast(g){
  var sv=savedFor(g.id),left=g.target-sv;
  if(left<=0)return {state:'done',sv:sv,left:0};
  var first='';S.entries.forEach(function(e){if(e.type==='save'&&e.goalId===g.id){var m=e.date.slice(0,7);if(!first||m<first)first=m;}});
  if(!first)return {state:'none0',sv:sv,left:left};
  var ms=[],k;for(k=1;k<=3;k++){var m2=shiftYM(curYM,-k);if(m2>=first)ms.push(m2);}
  var avg,basis;
  if(ms.length){avg=ms.reduce(function(a,m){return a+goalSavedIn(g.id,m);},0)/ms.length;basis=ms.length;}
  else{avg=goalSavedIn(g.id,curYM)||sv;basis=0;}
  if(avg<=0)return {state:'stalled',sv:sv,left:left};
  var months=Math.ceil(left/avg);
  if(months>600)return {state:'far',sv:sv,left:left,avg:avg,basis:basis};
  return {state:'ok',sv:sv,left:left,avg:avg,basis:basis,months:months,eta:shiftYM(curYM,months)};
}

function listBody(){
  var f=UI.f,sort=f.sort||'new',all=sorted(),filtering=listFiltering(f);

  var rowf=UI.selMode?selRowHTML:rowHTML;
  var head=(filtering||sort!=='new')?sumLine(matched):'';
  if(sort==='big'||sort==='small'){
    var flat=matched.slice().sort(function(x,y){return sort==='big'?y.amount-x.amount:x.amount-y.amount;}),more=flat.length>300;
    if(more)flat=flat.slice(0,300);
    return head+(flat.length?'<div class="card" style="padding:4px 18px">'+flat.map(rowf).join('')+'</div>'+(more?'<p class="mut" style="font-size:13px;text-align:center">先頭の300件を表示しています。条件を絞ると、ほかの明細も見られます。</p>':''):'<p class="empty">条件に合う明細はありません</p>');
  }
  var months=[curYM].concat(S.entries.map(function(e){return e.date.slice(0,7);})).filter(function(m,i,a){return a.indexOf(m)===i;}).sort().reverse();
  if(f.month) months=[f.month];
  if(sort==='old') months.reverse();
  var out=months.map(function(m){
    var items=matched.filter(function(e){return e.date.indexOf(m)===0;});

    if(!items.length&&filtering&&m!==f.month) return '';

    '<div class="card sumcard"><div><span>入金</span><span class="num in">'+yen(sumBy('in',m))+' 円</span></div><div><span>出金</span><span class="num">'+yen(sumBy('out',m))+' 円</span></div></div>'+
    (items.length?'<div class="card" style="padding:4px 18px">'+items.map(rowf).join('')+'</div>':'<div class="card empty">'+(m===curYM&&!filtering?'今月の明細はありません':'条件に合う明細はありません')+'</div>');
  }).join('');
  return head+(out||'<p class="empty">条件に合う明細はありません</p>');

function xferPairs(d){
  var ids=accList().map(function(a){return a.id;}),m={};
  S.entries.forEach(function(e){
    if(e.type!=='xfer')return;
    var a=eacc(e),b=e.to;if(!b||a===b||ids.indexOf(a)<0||ids.indexOf(b)<0)return;
    var k=a+'>'+b,o=m[k]||(m[k]={a:a,b:b,n:0,last:''});o.n++;if(e.date>o.last)o.last=e.date;
  });
  return Object.keys(m).map(function(k){return m[k];}).filter(function(o){return !(o.a===d.acc&&o.b===d.to);})
    .sort(function(x,y){return (y.n-x.n)||(y.last>x.last?1:-1);}).slice(0,3);
}

function krowH(ic,l,v,cls){return '<div class="krow"><span class="l">'+icon(ic)+l+'</span><span class="amt '+(cls||'')+'">'+v+'<small>円</small></span></div>';}
function catSums(type,ms){var set={},m={};ms.forEach(function(k){set[k]=1;});S.entries.forEach(function(e){if(e.type===type&&set[e.date.slice(0,7)])m[e.cat]=(m[e.cat]||0)+e.amount;});return m;}
function balAt(ym){var a=totalOpening();S.entries.forEach(function(e){if(e.date.slice(0,7)<=ym){if(e.type==='in')a+=e.amount;else if(e.type==='out'||e.type==='save')a-=e.amount;}});return a;}
function summaryHTML(ym){
  var inc=sumBy('in',ym),out=sumBy('out',ym),sv=sumBy('save',ym);
  if(!inc&&!out)return '';
  var pm=shiftYM(ym,-1),pinc=sumBy('in',pm),pout=sumBy('out',pm),net=inc-out,r=rateOf(inc,out),pr=rateOf(pinc,pout);
  return '<h3 class="h3" style="margin-top:24px">収支のまとめ</h3><div class="card" style="padding:4px 18px;margin-top:10px">'+krowH('inbox','入金','+'+yen(inc),'in')+krowH('send','出金','-'+yen(out))+krowH('wallet','収支(入金−出金)',(net>=0?'+':'-')+yen(Math.abs(net)),net>=0?'in':'')+(sv?krowH('coins','積立',yen(sv)):'')+'</div>'+
    '<div class="ysum"><p>貯蓄率(収支÷入金): <b>'+(r===null?'-':r+'%')+'</b>'+(r!==null&&pr!==null?'(前月 '+pr+'%)':'')+'</p>'+(pinc||pout?'<p class="mut">前月: 入金 '+yen(pinc)+'円 ・ 出金 '+yen(pout)+'円</p>':'')+(net<0?'<p class="mut">この月は出金が入金を上回っています。</p>':'')+'</div>';
}
function dayCum(m,len){var d=[],i,run=0;for(i=0;i<=len;i++)d.push(0);S.entries.forEach(function(e){if(e.type==='out'&&e.date.indexOf(m)===0){var k=Number(e.date.slice(8));if(k>=1&&k<=len)d[k]+=e.amount;}});for(i=1;i<=len;i++){run+=d[i];d[i]=run;}return d;}
function paceHTML(ym){
  var pm=shiftYM(ym,-1),n=daysIn(ym),pn=daysIn(pm),N=Math.max(n,pn),cur=dayCum(ym,n),prv=dayCum(pm,pn);
  if(!cur[n]&&!prv[pn])return '';

  var mx=Math.max(cur[td],prv[pn],1),W=340,H=150,L=6,R=6,T=16,B=22,i;
  var gx=function(d){return L+(d-1)/(N-1)*(W-L-R);},gy=function(v){return T+(1-v/mx)*(H-T-B);};
  var pp=[],cp=[],lab='';
  if(prv[pn])for(i=1;i<=pn;i++)pp.push(gx(i).toFixed(1)+','+gy(prv[i]).toFixed(1));
  for(i=1;i<=td;i++)cp.push(gx(i).toFixed(1)+','+gy(cur[i]).toFixed(1));
  for(i=1;i<=N;i++){if(i===1||i%5===0)lab+='<text x="'+gx(i).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" style="fill:var(--muted);font-size:9px">'+i+'</text>';}
  var a=cur[td],pd=Math.min(td,pn),b=prv[pd];
  var svg='<svg class="dsvg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="日ごとの出金の累計。'+td+'日までで'+yen(a)+'円"><text x="'+L+'" y="10" style="fill:var(--muted);font-size:9px">最大 '+yen(mx)+'円</text><line x1="'+L+'" x2="'+(W-R)+'" y1="'+(H-B)+'" y2="'+(H-B)+'" style="stroke:var(--line)" stroke-width="1"/>'+
    (pp.length?'<polyline points="'+pp.join(' ')+'" fill="none" style="stroke:var(--muted)" stroke-width="1.8" stroke-dasharray="4 3" stroke-linecap="round" stroke-linejoin="round"/>':'')+
    '<polyline points="'+cp.join(' ')+'" fill="none" style="stroke:var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+gx(td).toFixed(1)+'" cy="'+gy(a).toFixed(1)+'" r="3" style="fill:var(--accent)"/>'+lab+'</svg>';
  var cap=(ym===curYM?td+'日までの出金は '+yen(a)+'円':'月末までの出金は '+yen(a)+'円')+(prv[pn]?'。前月の同じ時点('+pd+'日)は '+yen(b)+'円で、'+(a>b?yen(a-b)+'円 多いペースです':a<b?yen(b-a)+'円 少ないペースです':'同じペースです'):'')+'。';
  return '<h3 class="h3" style="margin-top:24px">出金ペース(日ごとの累計)</h3><div class="tlegend"><span><i style="background:var(--accent)"></i>'+mLabel(ym)+'</span>'+(pp.length?'<span><i style="background:var(--muted)"></i>'+mLabel(pm)+'</span>':'')+'</div>'+svg+'<p class="note2 num">'+cap+'</p>';
}
function rankHTML(ms,total){
  var set={},g={};ms.forEach(function(m){set[m]=1;});
  S.entries.forEach(function(e){if(e.type!=='out'||!e.memo||!set[e.date.slice(0,7)])return;var k=fold(e.memo),o=g[k]||(g[k]={n:e.memo,c:0,v:0});o.c++;o.v+=e.amount;});
  var arr=Object.keys(g).map(function(k){return g[k];}).sort(function(x,y){return y.v-x.v;}).slice(0,5);
  if(!arr.length)return '';
  var top=arr[0].v||1;
  return '<h3 class="h3" style="margin-top:24px">支出の多いお店・内容 TOP5</h3>'+arr.map(function(o,i){return '<div class="catrow"><div class="between"><b>'+(i+1)+'. '+esc(o.n)+'</b><span class="num">'+yen(o.v)+'円'+(total?' ・ '+Math.round(o.v/total*100)+'%':'')+'</span></div><div class="track"><span class="fill" style="width:'+(o.v/top*100)+'%"></span></div><small class="mut num">'+o.c+'回 ・ 1回平均 '+yen(o.v/o.c)+'円</small></div>';}).join('')+'<p class="note2">「店名・内容」が同じ出金を合計しています(メモが空の出金は含みません)。</p>';
}
function yearExtra(y,ms,pms,last,inc,out,pinc,pout){
  var h='',r=rateOf(inc,out),pr=rateOf(pinc,pout),i;
  if(inc){
    var rs=ms.slice(0,last).map(function(m){return rateOf(sumBy('in',m),sumBy('out',m));}),bi=-1,wi=-1;
    rs.forEach(function(v,k){if(v===null)return;if(bi<0||v>rs[bi])bi=k;if(wi<0||v<rs[wi])wi=k;});
    h+='<h3 class="h3" style="margin-top:24px">貯蓄率</h3><div class="ysum"><p>年間の貯蓄率(収支÷入金): <b>'+r+'%</b>'+(pr!==null?'(前年 '+pr+'%)':'')+'</p>'+(bi>=0&&wi>=0&&bi!==wi?'<p class="mut">最も高い月: '+mn(ms[bi])+'('+rs[bi]+'%) ・ 最も低い月: '+mn(ms[wi])+'('+rs[wi]+'%)</p>':'')+(out>inc?'<p class="mut">この年は出金が入金を上回っています。</p>':'')+'</div>';
    var iby=catSums('in',ms),piby=catSums('in',pms),icats=INC.filter(function(c){return iby[c[0]];}).sort(function(a,b){return iby[b[0]]-iby[a[0]];});
    if(icats.length)h+='<h3 class="h3" style="margin-top:24px">入金の内訳</h3>'+icats.map(function(c){var v=iby[c[0]],pv=piby[c[0]]||0,d=v-pv;return '<div class="catrow"><div class="between"><b>'+c[1]+'</b><span class="num">'+yen(v)+'円 ・ '+Math.round(v/inc*100)+'%</span></div><div class="track"><span class="fill" style="width:'+(v/inc*100)+'%"></span></div><small class="mut num">'+(pv?'前年 '+yen(pv)+'円('+(d>=0?'+':'-')+yen(Math.abs(d))+'円)':'前年の記録なし')+'</small></div>';}).join('');
  }
  var vals=ms.slice(0,last).map(balAt);
  if(vals.length>=2){
    var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals),span=(hi-lo)||Math.max(Math.abs(hi),1);lo-=span*0.15;hi+=span*0.15;
    var W=340,H=150,L=10,R=10,T=22,B=22,gx=function(k){return L+(W-L-R)*k/(vals.length-1);},gy=function(v){return T+(1-(v-lo)/(hi-lo))*(H-T-B);};
    var pts=vals.map(function(v,k){return gx(k).toFixed(1)+','+gy(v).toFixed(1);}),dots='',lab='';
    vals.forEach(function(v,k){dots+='<circle cx="'+gx(k).toFixed(1)+'" cy="'+gy(v).toFixed(1)+'" r="2.6" style="fill:var(--accent)"/>';lab+='<text x="'+gx(k).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" style="fill:var(--muted);font-size:8.5px">'+mn(ms[k])+'</text>';});
    var n=vals.length,dif=vals[n-1]-vals[0];
    var svg='<svg class="tsvg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+mn(ms[0])+'末から'+mn(ms[n-1])+'末までの手元の残高の推移。'+yen(vals[0])+'円から'+yen(vals[n-1])+'円"><line x1="'+L+'" x2="'+(W-R)+'" y1="'+(H-B)+'" y2="'+(H-B)+'" style="stroke:var(--line)" stroke-width="1"/>'+
      (lo<0&&hi>0?'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+gy(0).toFixed(1)+'" y2="'+gy(0).toFixed(1)+'" style="stroke:var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>':'')+
      '<polyline points="'+pts.join(' ')+'" fill="none" style="stroke:var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'+dots+
      '<text x="'+L+'" y="12" style="fill:var(--muted);font-size:9px">'+yen(vals[0])+'円</text><text x="'+(W-R)+'" y="12" text-anchor="end" style="fill:var(--muted);font-size:9px">'+yen(vals[n-1])+'円</text>'+lab+'</svg>';
    h+='<h3 class="h3" style="margin-top:24px">手元の残高の推移(月末)</h3>'+svg+'<p class="note2 num">'+mn(ms[0])+'末 '+yen(vals[0])+'円 → '+mn(ms[n-1])+'末 '+yen(vals[n-1])+'円('+(dif>=0?'+':'-')+yen(Math.abs(dif))+'円)。積立に回した分は含みません。</p>';
  }
  return h+rankHTML(ms,out);
}
function reportSheet(){
  var ym=UI.repYM,out=sumBy('out',ym),prev=sumBy('out',shiftYM(ym,-1)),by=spentByCat(ym);
  var items=sorted().filter(function(e){return e.type==='out'&&e.date.indexOf(ym)===0;});
  var cats=OUTC.filter(function(c){return by[c[0]];}).sort(function(a,b){return by[b[0]]-by[a[0]];});
  var diff=out===prev?'前月と同じ金額です':out>prev?'前月より '+yen(out-prev)+'円 多い':'前月より '+yen(prev-out)+'円 少ない';
  var lyYM=shiftYM(ym,-12),lyOut=sumBy('out',lyYM);
  if(lyOut>0){var lp=Math.round(Math.abs(out-lyOut)/lyOut*100);diff+='<br>'+(out===lyOut?'前年同月と同じ金額です':(out>lyOut?'前年同月より '+yen(out-lyOut)+'円 多い(+'+lp+'%)':'前年同月より '+yen(lyOut-out)+'円 少ない(-'+lp+'%)'));}
  var h=chartHTML(ym,true)+'<p class="mut" style="margin-top:18px">'+ymLabel(ym)+'の出金</p><div class="mid">'+yen(out)+'<span>円</span></div><p class="diff">'+(prev||out?diff:'')+'</p><button class="btn quiet" style="margin-top:14px" data-act="pdf-open" data-ym="'+ym+'">'+icon('doc')+'PDFプレビュー</button><button class="btn quiet" style="margin-top:10px" data-act="year-open" data-y="'+fyOf(ym)+'">'+icon('chart')+'年間レポート</button>';
  h+=summaryHTML(ym);
  if(cats.length){
    h+='<h3 class="h3" style="margin-top:24px">カテゴリ別</h3>'+donutHTML(cats,by,out)+cats.map(function(c){var v=by[c[0]];return '<div class="catrow"><div class="between"><b><i class="cdot" style="background:'+catColor(c[0])+'"></i>'+c[1]+'</b><span class="num">'+yen(v)+'円 ・ '+Math.round(v/out*100)+'%</span></div><div class="track"><span class="fill" style="width:'+(v/out*100)+'%"></span></div></div>';}).join('');
  }
  h+=cmpHTML(ym)+fixedHTML(ym)+satHTML(ym)+paceHTML(ym)+weekdayHTML(ym)+dailyHTML(ym)+rankHTML([ym],out);
  h+=trendHTML();
  h+='<h3 class="h3" style="margin-top:24px">明細</h3>'+(items.length?'<div class="card" style="padding:4px 18px;margin-top:8px">'+items.map(rowHTML).join('')+'</div>':'<div class="empty">'+icon('doc')+'出金はありません</div>');
  return frame('出金レポート',h);
}
function detailSheet0(){

  var sign=e.type==='xfer'?'':e.type==='in'?'+':'-';

function budgetInfo(){
  var sp=spentByCat(curYM),cm=carryOf(curYM),day=new Date().getDate(),dim=daysIn(curYM),res=[];
  OUTC.forEach(function(c){
    var b0=Number(S.budgets[c[0]])||0;if(!b0)return;
    var b=Math.max(0,b0+(cm[c[0]]||0)),u=sp[c[0]]||0;
    res.push({k:c[0],n:c[1],b:b,u:u,p:b?u/b*100:(u>0?101:0),proj:day>=5?u/day*dim:u,left:Math.max(0,dim-day)});
  });
  return res;
}
function catPct(cat){var b0=Number(S.budgets[cat])||0;if(!b0)return -1;var b=Math.max(0,b0+(carryOf(curYM)[cat]||0)),u=spentByCat(curYM)[cat]||0;return b?u/b*100:(u>0?101:0);}
function alerts(){
  var a=[],bal=balance(),th=S.alertPct||80;
  var tk=(S.tasks||[]).filter(function(x){return !x.done&&x.due;}),tdy=todayStr();
  var tod=tk.filter(function(x){return x.due<tdy;}),tdd=tk.filter(function(x){return x.due===tdy;});
  function tnames(l){return l.slice(0,3).map(function(x){return x.t;}).join('、')+(l.length>3?' ほか':'');}
  if(tod.length)a.push({l:'warn',t:'期限切れのタスクが'+tod.length+'件あります',b:tnames(tod)});
  if(tdd.length)a.push({l:'warn',t:'今日が期限のタスクが'+tdd.length+'件あります',b:tnames(tdd)});
  if(bal<S.low) a.push({l:'warn',t:'残高が設定金額を下回っています',b:'現在 '+yen(bal)+'円。設定は '+yen(S.low)+'円です。'});
  budgetInfo().forEach(function(i){
    var per=i.left>0&&i.b>i.u?'(残り'+i.left+'日、1日あたり約'+yen((i.b-i.u)/i.left)+'円)':'';
    if(i.p>100) a.push({k:'bud',l:'warn',t:i.n+'が予算を超えました',b:yen(i.u)+'円 / 予算 '+yen(i.b)+'円(超過 '+yen(i.u-i.b)+'円)'});
    else if(i.p>=th) a.push({k:'bud',l:'near',t:i.n+'が予算の'+th+'%に達しました',b:yen(i.u)+'円 / 予算 '+yen(i.b)+'円。あと'+yen(i.b-i.u)+'円'+per});
    else if(S.pace!==false&&i.u>0&&i.proj>i.b) a.push({k:'bud',l:'near',t:i.n+'は今のペースだと予算を超えそうです',b:'月末の見込み 約'+yen(i.proj)+'円 / 予算 '+yen(i.b)+'円'});
  });
  ybudgetInfo().forEach(function(i){
    if(i.p>100) a.push({k:'bud',l:'warn',t:i.n+'が年間予算を超えました',b:yen(i.u)+'円 / 年間予算 '+yen(i.b)+'円(超過 '+yen(i.u-i.b)+'円)'});
    else if(i.p>=th) a.push({k:'bud',l:'near',t:i.n+'が年間予算の'+th+'%に達しました',b:yen(i.u)+'円 / 年間予算 '+yen(i.b)+'円。あと'+yen(i.b-i.u)+'円'});
  });
  S.goals.forEach(function(g){var sv=savedFor(g.id);if(sv>=g.target)a.push({l:'ok',t:esc(g.name)+'の目標を達成しました',b:yen(sv)+'円を積み立てています。'});});
  S.goals.forEach(function(g){var p=goalPlan(g);if(!p)return;
    if(p.state==='late')a.push({l:'near',t:esc(g.name)+'の積立が期限に間に合わない見込みです',b:'期限 '+ymLabel(g.due)+'までに、月'+yen(p.need)+'円ずつの積立が必要です(今のペース: 月'+yen(Math.round(p.avg))+'円)。'});
    else if(p.state==='past')a.push({l:'warn',t:esc(g.name)+'の期限を過ぎています',b:'あと'+yen(p.left)+'円です。期限を見直すか、積立を続けましょう。'});});
  return a;
}

function instGroups(){
  var g={},order=[];
  accList().forEach(function(a){
    var nm=acctInst(a),o=g[nm];
    if(!o){var f=finByName(nm);o=g[nm]={name:nm||'その他・未設定',color:f?f[2]:acctColor(a),mark:f?f[3]:(nm?nm.charAt(0):'他'),accs:[],assets:0,debt:0,none:!nm};order.push(nm);}
    var b=accBal(a.id),isCard=!!cardOf(a);
    o.accs.push({a:a,b:b,card:isCard});
    if(isCard&&b<0)o.debt+=-b;else o.assets+=b;
  });
  return order.map(function(k){var o=g[k];o.net=o.assets-o.debt;return o;}).sort(function(x,y){return (x.none?1:0)-(y.none?1:0)||(y.net-x.net);});
}

function instCard(){
  if(!S.accounts.length)return '';
  var gs=instGroups(),pos=gs.filter(function(o){return o.assets>0;}),tot=pos.reduce(function(a,o){return a+o.assets;},0);
  return '<section class="card"><div class="between"><h2 class="h3">金融機関別の残高</h2><button class="link" data-act="insts-open">詳しく見る</button></div>'+
    (tot>0&&!S.hide?'<div class="wbar" role="img" aria-label="金融機関ごとの資産の割合">'+pos.map(function(o){return '<i style="width:'+(o.assets/tot*100)+'%;background:'+esc(o.color)+'"></i>';}).join('')+'</div>':'')+
    '<div style="margin-top:6px">'+gs.slice(0,4).map(function(o){return '<div class="krow"><span class="l">'+instMark(o)+esc(o.name)+'</span><span class="amt">'+money(o.net)+'<small>円</small></span></div>';}).join('')+'</div>'+(gs.length>4?'<p class="note2">ほか'+(gs.length-4)+'件は「詳しく見る」から</p>':'')+'</section>';
}

/* ---------- クレジットカードの引き落とし管理 ---------- */
function cardOf(a){
  var c=a&&a.card;if(!c)return null;
  var cl=Math.min(31,Math.max(1,Math.round(Number(c.close))||1)),py=Math.min(31,Math.max(1,Math.round(Number(c.pay))||1));
  var fr=String(c.from||'main');
  if(fr===a.id||!accList().some(function(x){return x.id===fr;}))fr='main';
  return {close:cl,pay:py,from:fr};
}
function cardInfo(a){
  var c=cardOf(a);if(!c)return null;
  var td=todayStr(),now=new Date(),best=null;
  function ds(y,m,d){var x=new Date(y,m,1);y=x.getFullYear();m=x.getMonth();return y+'-'+pad(m+1)+'-'+pad(Math.min(d,new Date(y,m+1,0).getDate()));}
  for(var k=-2;k<=3&&!best;k++){
    var cd=ds(now.getFullYear(),now.getMonth()+k,c.close),pd=ds(now.getFullYear(),now.getMonth()+k+(c.pay<=c.close?1:0),c.pay);
    if(pd>=td)best={close:cd,pay:pd};
  }
  if(!best)return null;
  var unpaid=-accBal(a.id),after=0;
  S.entries.forEach(function(e){
    if(eacc(e)!==a.id||e.date<=best.close)return;
    if(e.type==='out'||e.type==='save')after+=e.amount;else if(e.type==='in')after-=e.amount;
  });
  return {c:c,close:best.close,pay:best.pay,unpaid:unpaid,due:Math.max(0,unpaid-after),from:c.from};
}
function mdLbl(d){return Number(d.slice(5,7))+'月'+Number(d.slice(8,10))+'日';}

  if(S.accounts.length) h+='<button class="btn quiet" style="margin-top:10px" data-act="entry-new" data-type="xfer">'+icon('swap')+'口座間で振替する</button>';
  return frame('口座・財布',h);

    '<p class="err" id="a-err" role="alert" hidden></p><div class="foot"><button class="btn primary" data-act="acct-save">'+(edit?'更新する':'追加する')+'</button>'+(edit&&!main?'<button class="btn danger" data-act="acct-del">'+(UI.wipe?'もう一度押すと削除します':'この口座を削除する')+'</button>':'')+'</div>';

function finByName(nm){
  var k=fold(nm||'').trim(),i,f;if(!k)return null;
  for(i=0;i<FIN.length;i++)if(fold(FIN[i][0])===k)return FIN[i];
  for(i=0;i<FIN.length;i++){f=fold(FIN[i][0]);if(k.length>=2&&f.length>=2&&(k.indexOf(f)>=0||f.indexOf(k)>=0))return FIN[i];}
  return null;
}
function acctInst(a){if(a.inst)return a.inst;var f=finByName(a.name);return f?f[0]:'';}
function acctFin(a){return finByName(acctInst(a));}
function acctColor(a){if(a.color)return a.color;var f=acctFin(a);return f?f[2]:'#7a8a82';}
function acctMark(a){var f=acctFin(a);return f?f[3]:String(a.name||'?').charAt(0);}
function fbadge(a,id){return '<span class="fbadge"'+(id?' id="'+id+'"':'')+' style="background:'+esc(acctColor(a))+'" aria-hidden="true">'+esc(acctMark(a))+'</span>';}
function acctColorRow(d){
  var cur=d.color||'',pv={name:d.name,inst:d.inst,color:d.color};

}
function finCands(d){
  var isCard=!!(d&&d.card),used={},q=fold((($('#a-name')||{}).value!=null?$('#a-name').value:d.name)||'').trim();
  accList().forEach(function(a){if(a.id!==d.id)used[fold(a.name)]=1;});
  var l=FIN.filter(function(f){var k=fold(f[0]);return (isCard?f[1]==='card':f[1]!=='card')&&!used[k]&&k!==q&&k!==fold(d.name||'')&&(!q||k.indexOf(q)>=0||fuzzyHit(k,q));});
  return l.slice(0,q?10:12);
}
function acctSugHTML(d){

    if(d){return d.save({filename:name,data:blob}).then(function(){toast('保存しました');}).catch(function(e){if(!e||e.code!=='declined')toast('保存できませんでした');});}

  if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();tourClose();}
  else if(ev.key==='ArrowRight'){tourGo(1);}
  else if(ev.key==='ArrowLeft'){tourGo(-1);}
},true);
/* 初めて開いたときだけ自動で表示(すでにデータがある場合は設定の「使い方を見る」から) */
/* ログインできる状態のときは、ログイン画面を閉じたあとに表示する(tourHold) */
var tourHold=false;
function tourSchedule(){
  var n=0,ok=0;clearInterval(tourSchedule.t);
  tourSchedule.t=setInterval(function(){
    if(++n>60){clearInterval(tourSchedule.t);return;}
    if(tourHold||document.getElementById('fbauth')||document.getElementById('fbdlg')){ok=0;return;}
    if(++ok<3)return;
    clearInterval(tourSchedule.t);
    var lk=$('#lock');
    if(lsGet('futaba-tour')!=='1'&&!hadLocal&&(!lk||lk.hidden)&&!$('#tour'))tourOpen(0);
  },500);
}
setTimeout(function(){if(!tourHold)tourSchedule();},1800);

var WN={i:0,pages:[]};
function wnRender(){
  var el=$('#whatsnew');if(!el)return;
  var d=WN.pages[WN.i],n=WN.pages.length,last=WN.i===n-1;
  el.innerHTML='<div class="tour-card wn" role="dialog" aria-modal="true" aria-label="新機能のお知らせ"><div class="tour-body" key="'+WN.i+'">'+tourIcon(d.ic)+'<span class="wn-ver">新機能 ・ バージョン '+esc(d.v)+'</span><h2 class="tour-t">'+esc(d.t)+'</h2><ul class="wn-list">'+d.items.map(function(it){return '<li><span><b>'+esc(it[0])+'</b><br>'+esc(it[1])+'</span></li>';}).join('')+'</ul></div>'+
    (n>1?'<div class="tour-dots" aria-label="'+(WN.i+1)+' / '+n+'">'+WN.pages.map(function(x,i){return '<i class="'+(i===WN.i?'on':'')+'"></i>';}).join('')+'</div>':'<div style="height:20px"></div>')+
    '<div class="tour-btns'+(n>1?'':' one')+'">'+(n>1?(WN.i===0?'<button class="btn tour-sec" data-act="wn-close">閉じる</button>':'<button class="btn tour-sec" data-act="wn-prev">戻る</button>'):'')+'<button class="btn primary" data-act="wn-next" id="wn-next">'+(last?'OK':'次へ')+'</button></div></div>';
  var b=$('#wn-next');if(b)b.focus({preventScroll:true});
}
function wnOpen(pages){
  if(!pages||!pages.length||$('#whatsnew'))return;
  WN.pages=pages;WN.i=0;
  var el=document.createElement('div');el.id='whatsnew';el.className='tour';document.body.appendChild(el);
  document.body.style.overflow='hidden';wnRender();
}
function wnGo(n){var j=WN.i+n;if(j>=WN.pages.length){wnClose();return;}if(j<0)return;WN.i=j;wnRender();}
function wnClose(){
  lsSet('futaba-seen-ver',APP_VERSION);
  var el=$('#whatsnew');if(el)el.remove();
  if(!UI.sheet)document.body.style.overflow='';
}
document.addEventListener('keydown',function(ev){
  if(!$('#whatsnew'))return;
  if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();wnClose();}
  else if(ev.key==='ArrowRight'){wnGo(1);}
  else if(ev.key==='ArrowLeft'){wnGo(-1);}
},true);
function wnAuto(n){
  var seen=lsGet('futaba-seen-ver');
  if(!seen&&!hadLocal&&lsGet('futaba-tour')!=='1'){lsSet('futaba-seen-ver',APP_VERSION);return;}
  var from=seen||'1.0.0';
  var pages=NEWS.filter(function(x){return verCmp(x.v,from)>0&&verCmp(x.v,APP_VERSION)<=0;});
  if(!pages.length){if(!seen)lsSet('futaba-seen-ver',APP_VERSION);return;}
  var lk=$('#lock');
  if((lk&&!lk.hidden)||$('#tour')||$('#whatsnew')||UI.sheet){if(n<60)setTimeout(function(){wnAuto(n+1);},1500);return;}
  wnOpen(pages);
}
setTimeout(function(){wnAuto(0);},2600);
function updBanner(v){
  var el=$('#upd');
  if(!el){el=document.createElement('div');el.id='upd';el.className='upd';el.setAttribute('role','status');document.body.appendChild(el);}
  el.innerHTML='<span>新しいバージョン'+(v?' '+esc(v):'')+'があります</span><button class="ub" data-act="app-update">更新する</button><button class="ux" data-act="app-upd-close" aria-label="閉じる">'+icon('close')+'</button>';
  el.hidden=false;
}
window.futabaUpd=updBanner;
function checkUpdate(manual){
  if(!/^https?:$/.test(location.protocol)){if(manual)toast('ファイルを直接開いている場合は、更新を確認できません',2800);return;}
  if(manual)toast('確認しています…');
  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)navigator.serviceWorker.getRegistration().then(function(r){if(r)r.update().catch(function(){});}).catch(function(){});
  fetch(location.href.split('#')[0].split('?')[0]+'?_='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('http');return r.text();}).then(function(t){
    var m=t.match(/<meta name="app-version" content="([^"]+)"/),v=m?m[1]:'';
    lsSet('futaba-updchk',String(Date.now()));
    if(v&&verCmp(v,APP_VERSION)>0)updBanner(v);
    else if(manual)toast('最新バージョンです(v'+APP_VERSION+')');
  }).catch(function(){if(manual)toast('確認できませんでした。通信状況を確認してください',2800);});
}
function autoUpd(){var last=Number(lsGet('futaba-updchk'))||0;if(Date.now()-last>6*3600000)checkUpdate(false);}
function applyUpdate(){
  function go(){location.reload();}
  var p=('caches' in window)?caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}):Promise.resolve();
  p.catch(function(){}).then(function(){
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)return navigator.serviceWorker.getRegistration().then(function(r){if(r&&r.waiting)r.waiting.postMessage('SKIP_WAITING');});
  }).catch(function(){}).then(function(){setTimeout(go,150);});
}
setTimeout(autoUpd,4000);

/* ---------- tasks (タスク管理) ---------- */
function taskGet(id){return S.tasks.filter(function(k){return k.id===id;})[0]||null;}
function taskDay(off){var d=new Date();d.setDate(d.getDate()+off);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function taskDue(due){
  if(!due)return ['',''];
  var md=Number(due.slice(5,7))+'/'+Number(due.slice(8,10)),t=todayStr();
  if(due<t)return ['期限切れ '+md,'od'];
  if(due===t)return ['今日','t0'];
  if(due===taskDay(1))return ['明日','t1'];
  return [md,''];
}
function taskAdd(){
  if(VIEW)return;
  var i=$('#k-new'),d=$('#k-due'),t=i?i.value.trim().slice(0,80):'';
  if(!t){toast('タスクの内容を入力してください');if(i)i.focus();return;}
  if(S.tasks.length>=200){toast('タスクは200件までです');return;}
  S.tasks.unshift({id:'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),t:t,n:'',due:d&&/^\d{4}-\d{2}-\d{2}$/.test(d.value)?d.value:'',done:false,ts:Date.now()});
  UI.tf='open';persist();render();rerenderSheet();toast('追加しました');
  setTimeout(function(){var n=$('#k-new');if(n)n.focus({preventScroll:true});},40);
}
function taskBack(){clearTimeout(taskBack.t);persist();render();UI.kid='';UI.wipe=false;openSheet('tasks',tasksSheet());}
function tasksSheet(){
  var f=UI.tf||'open',open=S.tasks.filter(function(k){return !k.done;}),done=S.tasks.filter(function(k){return k.done;});
  var list=(f==='open'?open.sort(function(a,b){return (a.due||'9999')<(b.due||'9999')?-1:(a.due||'9999')>(b.due||'9999')?1:b.ts-a.ts;}):done.sort(function(a,b){return b.ts-a.ts;}));
  var h='<div class="tadd"><input id="k-new" class="mq" maxlength="80" placeholder="新しいタスク" autocomplete="off"><div class="trow2"><input id="k-due" class="mq" type="date" aria-label="期限"><button class="btn primary" data-act="task-add">追加</button></div></div><div class="sug" id="task-sug" aria-label="タスクの候補"></div>'+dueChips();
  h+='<div class="tseg" role="group" aria-label="表示"><button data-act="task-f" data-f="open" aria-pressed="'+(f==='open')+'">未完了 '+open.length+'</button><button data-act="task-f" data-f="done" aria-pressed="'+(f==='done')+'">完了 '+done.length+'</button></div>';
  if(!list.length)h+='<div class="empty">'+icon('tasks')+(f==='open'?'未完了のタスクはありません':'完了したタスクはありません')+'</div>';
  else h+='<div class="tlist">'+list.map(function(k){
    var d=taskDue(k.due);
    return '<div class="trow'+(k.done?' done':'')+'"><button class="tchk" data-act="task-toggle" data-id="'+esc(k.id)+'" aria-pressed="'+k.done+'" aria-label="'+(k.done?'未完了に戻す':'完了にする')+'">'+icon('tick')+'</button><button class="tmain" data-act="task-edit" data-id="'+esc(k.id)+'"><span class="tt">'+esc(k.t)+'</span>'+(d[0]&&!k.done?'<span class="td '+d[1]+'">'+d[0]+'</span>':'')+'</button></div>';
  }).join('')+'</div>';
  if(f==='done'&&done.length)h+='<button class="btn danger" style="margin-top:14px" data-act="task-clear">'+(UI.wipe?'もう一度押すと削除します':'完了したタスクをすべて削除')+'</button>';
  return frame('タスク',h);
}
function taskSheet(){
  var k=taskGet(UI.kid);if(!k)return frame('タスク','<div class="empty">タスクが見つかりません</div>');
  return frame('タスク','<div class="memo"><input id="k-t" class="mtitle" maxlength="80" placeholder="タスクの内容" value="'+esc(k.t)+'"><label class="fld"><span>期限</span><input id="k-d" class="mq" type="date" value="'+esc(k.due)+'"></label>'+dueChips()+'<label class="fld"><span>メモ</span><textarea id="k-n" class="mbody" style="min-height:140px" maxlength="500" placeholder="補足があれば">'+esc(k.n)+'</textarea></label><div class="mfoot"><button class="btn" data-act="task-done-edit">'+(k.done?'未完了に戻す':'完了にする')+'</button><button class="btn danger" data-act="task-del">'+(UI.wipe?'もう一度押すと削除します':'削除する')+'</button></div><p class="mut" style="font-size:12.5px;margin-top:10px">入力した内容は自動で保存されます。</p></div>');
}
document.addEventListener('input',function(ev){
  var id=ev.target&&ev.target.id;
  if(UI.sheet!=='task'||(id!=='k-t'&&id!=='k-n'&&id!=='k-d'))return;
  var k=taskGet(UI.kid);if(!k)return;
  if(id==='k-t'&&ev.target.value.trim())k.t=ev.target.value.trim().slice(0,80);
  if(id==='k-n')k.n=ev.target.value.slice(0,500);
  if(id==='k-d')k.due=/^\d{4}-\d{2}-\d{2}$/.test(ev.target.value)?ev.target.value:'';
  clearTimeout(taskBack.t);taskBack.t=setTimeout(persist,300);
});
document.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&ev.target&&ev.target.id==='k-new'&&!ev.isComposing){ev.preventDefault();taskAdd();}});

/* ---------- memo (メモ) ---------- */
function memoGet(id){return S.memos.filter(function(m){return m.id===id;})[0]||(UI.mnew&&UI.mnew.id===id?UI.mnew:null);}
function memoSync(){
  clearTimeout(memoSync.t);
  if(VIEW)return;
  var m=memoGet(UI.mid);if(!m)return;
  var t=$('#m-title'),b=$('#m-body');
  if(t)m.t=t.value.slice(0,40);if(b)m.b=b.value.slice(0,2000);
  if(!(m.t||m.b))return;
  m.ts=Date.now();
  if(S.memos.indexOf(m)<0){S.memos.unshift(m);if(S.memos.length>100)S.memos.length=100;}
  persist();
  var c=$('#m-count');if(c)c.textContent=m.b.length+' / 2000';
}
function memoBack(){
  memoSync();
  var m=memoGet(UI.mid);
  if(m&&!(m.t||m.b)){S.memos=S.memos.filter(function(x){return x!==m;});persist();}
  UI.mnew=null;UI.mid='';UI.wipe=false;
  openSheet('memos',memosSheet());
}
function memoDate(ts){return ts?new Date(ts).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'}):'';}
function memosSheet(){
  var list=S.memos.slice().sort(function(a,b){return (b.pin?1:0)-(a.pin?1:0)||b.ts-a.ts;});

  h+='<div class="mgrid">'+list.map(function(m){
    var first=m.t||(m.b.split('\n')[0]||'').slice(0,30)||'無題';
    var prev=(m.t?m.b:m.b.split('\n').slice(1).join(' ')).replace(/\s+/g,' ').slice(0,90);
    return '<button class="mcard" data-act="memo-open" data-id="'+esc(m.id)+'" data-q="'+esc((m.t+' '+m.b).toLowerCase().slice(0,400))+'"><span class="mt">'+(m.pin?'<i class="mpin" title="ピン留め"></i>':'')+esc(first)+'</span>'+(prev?'<span class="mb">'+esc(prev)+'</span>':'')+'<span class="md">'+memoDate(m.ts)+'</span></button>';

/* ---------- calculator (電卓) ---------- */
var CALC={e:'',eq:false};
function calcEval(x){
  x=x.replace(/[+\-−×÷]+$/,'');
  if(!x)return null;
  var j=x.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/^(\d+\.?\d*|\.\d+)([+\-])(\d+\.?\d*|\.\d+)%$/,'$1$2($1*$3/100)').replace(/(\d+\.?\d*|\.\d+)%/g,'($1/100)');
  if(!/^[\d.+\-*\/()\s]+$/.test(j))return null;
  j=j.replace(/(^|[^\d.])0+(?=\d)/g,'$1');
  try{var v=new Function('return ('+j+')')();if(typeof v!=='number'||!isFinite(v))return null;return Math.round(v*1e8)/1e8;}catch(e){return null;}
}
function calcFmt(v){return v===null?'0':v.toLocaleString('ja-JP',{maximumFractionDigits:8});}
function calcRefresh(){
  var r=calcEval(CALC.e),a=$('#calc-expr'),b=$('#calc-res');
  if(a)a.textContent=CALC.e||'\u00a0';
  if(b)b.textContent=r===null?'0':calcFmt(r);
}
function calcKey(k){
  var e=CALC.e,last=e.slice(-1),isOp=/[+−×÷]/.test(k);
  if(k==='ac'){CALC.e='';CALC.eq=false;}
  else if(k==='bk'){CALC.e=CALC.eq?'':e.slice(0,-1);CALC.eq=false;}
  else if(k==='='){var r=calcEval(e);if(r!==null){CALC.e=String(r);CALC.eq=true;}}
  else if(isOp){
    if(!e&&k!=='−')return;
    if(/[+−×÷]/.test(last)){CALC.e=e.slice(0,-1)+k;}else if(last==='.'){return;}else CALC.e=e+k;
    CALC.eq=false;
  }else if(k==='%'){
    if(!/[\d]$/.test(e))return;CALC.e=e+'%';CALC.eq=false;
  }else{
    if(CALC.eq){e='';CALC.eq=false;}
    if(last==='%'&&!CALC.eq)e+='×';
    var cur=(e.match(/[\d.]*$/)||[''])[0];
    if(k==='.'){if(cur.indexOf('.')>=0)return;if(!cur)k='0.';}
    if((k==='0'||k==='00')&&cur==='0')return;
    if(e.length>=40)return;
    CALC.e=e+k;
  }
  calcRefresh();
}
function calcFn(fn){
  var r=calcEval(CALC.e);
  if(r===null){toast('先に数字を入力してください');return;}
  if(fn==='copy'){var t=String(r);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast('コピーしました');},function(){toast('コピーできませんでした');});else toast('コピーできませんでした');return;}
  if(fn==='out'||fn==='in'){
    if(VIEW){toast('閲覧モード中は記録できません');return;}
    var amt=Math.round(r);if(amt<=0){toast('0より大きい金額にしてください');return;}
    UI.draft=newDraft(fn);UI.draft.amount=amt;UI.wipe=false;UI.from='';openSheet('entry',entrySheet());return;
  }
  var f={tax10:function(v){return Math.floor(v*1.1);},tax8:function(v){return Math.floor(v*1.08);},ex10:function(v){return Math.floor(v/1.1);},ex8:function(v){return Math.floor(v/1.08);}}[fn];
  if(f){CALC.e=String(f(r));CALC.eq=true;calcRefresh();}
}
function calcSheet(){
  var keys=[['ac','AC','fn'],['bk','⌫','fn'],['%','%','op'],['÷','÷','op'],['7','7',''],['8','8',''],['9','9',''],['×','×','op'],['4','4',''],['5','5',''],['6','6',''],['−','−','op'],['1','1',''],['2','2',''],['3','3',''],['+','+','op'],['00','00',''],['0','0',''],['.','.',''],['=','=','eq']];
  var r=calcEval(CALC.e);
  var h='<div class="kcalc"><div class="cdisp"><div id="calc-expr" class="cexpr">'+(CALC.e?esc(CALC.e):'&nbsp;')+'</div><div id="calc-res" class="cres num">'+(r===null?'0':esc(calcFmt(r)))+'</div></div>';
  h+='<div class="cfns" role="group" aria-label="消費税の計算">'+[['tax10','税込 10%'],['tax8','税込 8%'],['ex10','税抜 10%'],['ex8','税抜 8%']].map(function(t){return '<button class="chip" data-act="calc-fn" data-fn="'+t[0]+'">'+t[1]+'</button>';}).join('')+'</div>';
  h+='<div class="ckeys">'+keys.map(function(k){return '<button class="ck '+k[2]+'" data-act="calc-key" data-k="'+k[0]+'">'+k[1]+'</button>';}).join('')+'</div>';
  h+='<div class="cacts"><button class="btn" data-act="calc-fn" data-fn="out">出金に記録</button><button class="btn" data-act="calc-fn" data-fn="in">入金に記録</button><button class="btn" data-act="calc-fn" data-fn="copy">コピー</button></div></div>';
  return frame('電卓',h);
}
document.addEventListener('keydown',function(ev){

function fold(s){s=String(s||'').normalize('NFKC').toLowerCase();return s.replace(/[\u30a1-\u30f6]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0x60);});}
function memoStats(type){
  var m={};
  S.entries.forEach(function(e){
    if(e.type!==type||!e.memo)return;
    var k=e.memo,o=m[k]||(m[k]={memo:k,n:0,last:'',cat:{},amount:0,acc:'main'});
    o.n++;o.cat[e.cat]=(o.cat[e.cat]||0)+1;
    if(e.date>=o.last){o.last=e.date;o.amount=e.amount;o.acc=eacc(e);}
  });
  return Object.keys(m).map(function(k){var o=m[k],best='',bn=0;Object.keys(o.cat).forEach(function(c){if(o.cat[c]>bn){bn=o.cat[c];best=c;}});o.topCat=best;return o;});
}
function fuzzyHit(k,f){
  if(f.length<2)return false;
  var j=0;for(var i=0;i<k.length&&j<f.length;i++){if(k.charAt(i)===f.charAt(j))j++;}
  return j===f.length;
}
function sugList(type,q){
  var f=fold(q.trim()),all=memoStats(type);
  if(f){
    /* 前方一致 → 部分一致 → あいまい一致(文字が順に含まれる)の順に並べる */
    all=all.map(function(o){
      var k=fold(o.memo),p=k.indexOf(f);
      o._r=k===f?-1:p===0?0:p>0?1:fuzzyHit(k,f)?2:-1;
      return o;
    }).filter(function(o){return o._r>=0;});
    all.sort(function(a,b){return (a._r-b._r)||(b.n-a.n)||(b.last>a.last?1:-1);});
    return all.slice(0,8);
  }
  all.sort(function(a,b){return (b.n-a.n)||(b.last>a.last?1:-1);});
  return all.slice(0,6);

  function loanSched(l){
    var r=l.rate/1200,n=l.months,bal=l.principal,out=[],pay,i;
    pay=r>0?Math.round(l.principal*r/(1-Math.pow(1+r,-n))):Math.ceil(l.principal/n);
    for(i=0;i<n;i++){
      var it=Math.round(bal*r),p=(i===n-1)?bal+it:Math.min(pay,bal+it);
      bal=Math.max(0,bal-(p-it));
      var ym=shiftYM(l.start,i);
      out.push({date:ym+'-'+pad(Math.min(l.day,daysIn(ym))),pay:p,int:it,bal:bal});
    }
    return out;
  }
  function loanState(l){

function parseCSV(text){
  text=String(text||'').replace(/^\uFEFF/,'');
  var first=text.split(/\r?\n/,1)[0]||'',delim=first.split('\t').length>first.split(',').length?'\t':',';
  var rows=[],row=[],cell='',q=false,i,c;
  for(i=0;i<text.length;i++){c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"')q=true;
    else if(c===delim){row.push(cell);cell='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(function(x){return x.trim();}))rows.push(row);row=[];}
    else cell+=c;
  }
  row.push(cell);if(row.some(function(x){return x.trim();}))rows.push(row);
  return rows;
}

  if(!m){m=s.match(/^(\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);if(m)m[1]=String(2000+Number(m[1]));}
  if(!m)return '';y=Number(m[1]);var mo=Number(m[2]),d=Number(m[3]);

    if(!am||!okDate||!(parseNum(am[1])>0)){bad.push(raw.trim());return;}

function amtNorm(v){return String(v==null?'':v).normalize('NFKC').replace(/[×xX*✕]/g,'*').replace(/[÷\/]/g,'/').replace(/[−‐‑–—ー]/g,'-').replace(/[,\s円¥￥]/g,'');}
function amtHasOp(v){return /[\d)][+\-*\/]/.test(amtNorm(v));}
function amtEval(src){
  var s=amtNorm(src).replace(/[+\-*\/.]+$/,'');
  if(!s||!/^[\d.+\-*\/()]+$/.test(s))return null;
  var p=0;
  function pk(){return s.charAt(p);}
  function num(){var m=/^\d+(\.\d+)?/.exec(s.slice(p));if(!m)throw 0;p+=m[0].length;return parseFloat(m[0]);}
  function atom(){if(pk()==='('){p++;var v=add();if(pk()!==')')throw 0;p++;return v;}if(pk()==='-'){p++;return -atom();}return num();}
  function mul(){var v=atom();while(pk()==='*'||pk()==='/'){var o=s.charAt(p++),r=atom();if(o==='/'){if(!r)throw 0;v/=r;}else v*=r;}return v;}
  function add(){var v=mul();while(pk()==='+'||pk()==='-'){var o=s.charAt(p++),r=mul();v=o==='+'?v+r:v-r;}return v;}
  try{var v=add();if(p!==s.length||!isFinite(v))return null;return Math.min(Math.max(Math.round(v),0),9999999999);}catch(e){return null;}
}
function amtVal(v){return amtHasOp(v)?(amtEval(v)||0):parseNum(v);}

  if(amtHasOp(i.value)){var r=amtEval(i.value);p.textContent=r===null?'式を確認してください':'= '+yen(r)+'円';}else p.textContent='';
}

  if(u){lsSet(FB_SKIP,'0');fbClose();fbAttach(u);render();fbAcctRefresh();}
  else{
    fbDetach();render();if(UI.sheet==='account')closeSheet();
    if(FB.out){FB.out=false;tourHold=false;tourSchedule();}
    else if(lsGet(FB_SKIP)!=='1'){fbWhenReady(function(){if(!FB.user&&!document.getElementById('fbauth'))fbShow('login',true);});}
    else{tourHold=false;tourSchedule();}
  }
}

function pwScore(p){
  if(!p)return 0;
  var s=0,n=p.length;
  if(n>=6)s++;
  if(n>=10)s++;
  var k=(/[a-z]/.test(p)?1:0)+(/[A-Z]/.test(p)?1:0)+(/\d/.test(p)?1:0)+(/[^A-Za-z0-9]/.test(p)?1:0);
  if(k>=2)s++;
  if(k>=3&&n>=8)s++;
  if(n<6||/^(.)\1+$/.test(p)||/^(0123456789|1234567890|password|qwerty|12345678?)/i.test(p))s=Math.min(s,1);
  return Math.max(1,Math.min(4,s));
}

function fbSubmit(){
  if(FB.busy)return;
  var em=((document.getElementById('fba-email')||{}).value||'').trim(),pw=(document.getElementById('fba-pass')||{}).value||'';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return fbSay('メールアドレスを入力してください');
  if(FB.mode==='reset'){
    fbBusy(true);
    FB.auth.sendPasswordResetEmail(em).then(function(){fbBusy(false);fbSay('再設定メールを送りました。メールのリンクから新しいパスワードを設定してください。',true);}).catch(function(e){fbBusy(false);fbSay(fbMsg(e));});
    return;
  }
  if(!pw)return fbSay('パスワードを入力してください');
  if(FB.mode==='signup'&&pw.length<6)return fbSay('パスワードは6文字以上にしてください');
  fbBusy(true);fbSay('');
  var su=FB.mode==='signup';FB.fresh=su?'signup':'login';
  (su?FB.auth.createUserWithEmailAndPassword(em,pw):FB.auth.signInWithEmailAndPassword(em,pw)).then(function(){fbBusy(false);}).catch(function(e){
    fbBusy(false);FB.fresh='';
    if(su&&e&&e.code==='auth/email-already-in-use'){
      fbDialog({title:'このメールアドレスは登録済みです',body:em+' のアカウントはすでにあります。ログインしますか？',ok:'ログインする',onOk:function(){fbShow('login');setTimeout(function(){var f=document.getElementById('fba-pass');if(f)try{f.focus();}catch(x){}},80);}});
      return;
    }
    if(!su&&e&&e.code==='auth/user-not-found'){
      fbDialog({title:'アカウントが見つかりません',body:em+' はまだ登録されていません。新しくアカウントを作成しますか？',ok:'アカウントを作成',onOk:function(){fbShow('signup');}});
      return;
    }
    fbSay(fbMsg(e));
  });
}
function fbGoogle(){
  if(FB.busy)return;
  var pr=new firebase.auth.GoogleAuthProvider();fbBusy(true);fbSay('');FB.fresh='login';
  FB.auth.signInWithPopup(pr).then(function(){fbBusy(false);}).catch(function(e){
    fbBusy(false);FB.fresh='';
    if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')){FB.auth.signInWithRedirect(pr).catch(function(e2){fbSay(fbMsg(e2));});return;}
    fbSay(fbMsg(e));
  });
}

document.addEventListener('click',function(ev){
  var b=ev.target&&ev.target.closest?ev.target.closest('[data-fbact]'):null;if(!b)return;
  var a=b.getAttribute('data-fbact');
  if(a==='pwtoggle'){
    var pi=document.getElementById('fba-pass');if(!pi)return;
    var show=pi.type==='password';pi.type=show?'text':'password';
    b.setAttribute('aria-pressed',show);b.setAttribute('aria-label',show?'パスワードを隠す':'パスワードを表示');b.classList.toggle('on',show);
    return;
  }
  if(!FB.on)return;
  if(a!=='acct-menu')fbMenuClose();
  if(a==='login')fbShow('login');
  else if(a==='tab-login')fbShow('login');
  else if(a==='tab-signup')fbShow('signup');
  else if(a==='reset')fbShow('reset');
  else if(a==='google')fbGoogle();
  else if(a==='close'){fbClose();}
  else if(a==='skip'){lsSet(FB_SKIP,'1');FB.first=false;fbClose();}
  else if(a==='sync')fbSyncNow();
  else if(a==='acct-menu')fbMenuOpen(b);
  else if(a==='menu-close'){}
  else if(a==='dlg-ok'){var df=FB.dlgOk;fbDialogClose();if(df)df();}
  else if(a==='dlg-cancel')fbDialogClose();
  else if(a==='acct-open'){FB.delArm=false;FB.restoreArm='';openSheet('account',accountSheet());}
  else if(a==='acct-name-save')fbSaveName();
  else if(a==='acct-reset')fbSendReset();
  else if(a==='acct-restore')fbRestore(b.getAttribute('data-k'));
  else if(a==='acct-del'){FB.delArm=true;rerenderSheet();}
  else if(a==='acct-del-cancel'){FB.delArm=false;rerenderSheet();}
  else if(a==='acct-del-ok')fbDelete();
  else if(a==='logout')fbShow('logout');
  else if(a==='logout-ok'){FB.out=true;lsSet(FB_SKIP,'1');fbClose();FB.auth.signOut().then(function(){toast('ログアウトしました');}).catch(function(){FB.out=false;});}
  else if(a==='use-cloud'&&FB.choice){var c=FB.choice;FB.choice=null;var up=fbAdopt(c.cloud);c.go(!!up);fbClose();toast('クラウドのデータを使います');}
  else if(a==='use-local'&&FB.choice){var c2=FB.choice;FB.choice=null;try{localStorage.setItem('futaba-fb-backup-cloud'+PSFX,JSON.stringify(c2.cloud));}catch(e){}c2.go(true);fbClose();toast('この端末のデータをクラウドに保存します');}
});

function fbInit(){
  if((window.claude&&window.claude.use)||VIEW)return;
  var c=FIREBASE_CONFIG;if(!c.apiKey||!c.projectId)return;
  if(!/^https?:$/.test(location.protocol))return;
  tourHold=true;
  setTimeout(function(){if(!FB.on){tourHold=false;tourSchedule();}},12000);
  fbLoad('firebase-app-compat.js').then(function(){return Promise.all([fbLoad('firebase-auth-compat.js'),fbLoad('firebase-firestore-compat.js')]);}).then(function(){
    firebase.initializeApp(c);
    FB.auth=firebase.auth();FB.db=firebase.firestore();
    try{FB.auth.languageCode='ja';}catch(e){}
    try{FB.db.enablePersistence({synchronizeTabs:true}).catch(function(){});}catch(e){}
    FB.on=true;
    FB.auth.onAuthStateChanged(fbAuthChanged);
  }).catch(function(){tourHold=false;tourSchedule();});
}

function fbSendReset(){

function fbRestore(k){
  var b=fbBackups().filter(function(x){return x.k===k;})[0];if(!b)return;
  if(FB.restoreArm!==k){FB.restoreArm=k;rerenderSheet();return;}
  FB.restoreArm='';S=normalize(b.data);persist();render();rerenderSheet();toast('データを戻しました');
}

  if(prov.indexOf('password')>=0){

   .then(function(){FB.out=true;lsSet(FB_SKIP,'1');fbDetach();return u.delete();})
   .then(function(){FB.busy=false;FB.delArm=false;if(UI.sheet==='account')closeSheet();toast('アカウントを削除しました',2600);})

var NET={t:null};
function netEl(){var e=document.getElementById('netpill');if(!e){e=document.createElement('div');e.id='netpill';e.setAttribute('role','status');e.setAttribute('aria-live','polite');document.body.appendChild(e);}return e;}

/* ---------- アニメーション(数字のカウントアップ / タブの弾み / タップの波紋) ---------- */
var ANIM_OK=!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function animNums(root){
  if(!ANIM_OK||!root)return;
  var els=root.querySelectorAll('.big,.amt');
  Array.prototype.forEach.call(els,function(el,idx){
    if(idx>14)return;
    var n=el.firstChild;if(!n||n.nodeType!==3)return;
    var m=/^([+\-−]?)(\d[\d,]*)$/.exec(String(n.nodeValue).trim());if(!m)return;
    var target=parseInt(m[2].replace(/,/g,''),10);if(!(target>0)||target>1e12)return;
    var orig=n.nodeValue,t0=null,dur=Math.min(900,500+String(target).length*40);
    function step(ts){
      if(!document.body.contains(el)){n.nodeValue=orig;return;}
      if(t0===null)t0=ts;
      var pr=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-pr,3);
      n.nodeValue=pr>=1?orig:m[1]+Math.round(target*e).toLocaleString('ja-JP');
      if(pr<1)requestAnimationFrame(step);
    }
    n.nodeValue=m[1]+'0';requestAnimationFrame(step);
  });
}
function tabPop(){
  if(!ANIM_OK)return;
  var c=document.querySelector('#tabbar .tab[aria-current="page"]');
  if(c){c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');}
}
document.addEventListener('pointerdown',function(ev){
  if(!ANIM_OK)return;
  var t=ev.target&&ev.target.closest?ev.target.closest('.btn,.chip,.fc'):null;
  if(!t||t.disabled)return;
  var r=t.getBoundingClientRect(),d=Math.max(r.width,r.height)*1.6,sp=document.createElement('span');
  sp.className='rip';
  sp.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(ev.clientX-r.left-d/2)+'px;top:'+(ev.clientY-r.top-d/2)+'px';
  t.appendChild(sp);
  setTimeout(function(){if(sp.parentNode)sp.parentNode.removeChild(sp);},650);
},{passive:true});
setTimeout(fbInit,300);
})();

<style>
#pwa-banner{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));width:min(calc(100% - 32px),520px);box-sizing:border-box;z-index:45;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;background:var(--surface);color:var(--fg);border:1px solid var(--line);box-shadow:0 12px 36px rgba(0,0,0,.28);transform:translate(-50%,-140%);opacity:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s}
#pwa-banner.show{transform:translate(-50%,0);opacity:1}
#pwa-banner .pb-ic{flex:none;width:48px;height:48px;border-radius:14px;overflow:hidden;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-weight:900;font-size:22px}
#pwa-banner .pb-ic img{width:100%;height:100%;display:block;object-fit:cover}
#pwa-banner .pb-tx{flex:1;min-width:0;display:grid;gap:3px}
#pwa-banner .pb-tx b{font-size:15px;font-weight:900;line-height:1.3}
#pwa-banner .pb-tx span{font-size:12px;color:var(--muted);line-height:1.45}
#pwa-banner .pb-go{flex:none;padding:11px 20px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:900;font-size:14px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.2)}
#pwa-banner .pb-x{position:absolute;top:-9px;right:-7px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.3)}
